name: release

# Slice 1 of the packaging family: build the frozen binary on every target and
# gate each with the post-build frozen-proofs. No bundle assembly, no upload to a
# Release, no signing -- those land in slice 2 (which is the only place that earns
# contents: write). workflow_dispatch lets the matrix be observed without cutting a tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash            # uniform shell across legs; avoids pwsh/bash path divergence on Windows

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false     # a red leg must not cancel the others -- we want every target's verdict
      matrix:
        include:
          - { os: windows-latest,  arch: x64,   ext: '.exe', ship: true  }
          - { os: macos-14,        arch: arm64, ext: '',     ship: true  }   # Apple Silicon
          - { os: macos-15-intel,  arch: x64,   ext: '',     ship: true  }   # Intel x86_64 (macos-13 retired Dec 2025; this label supported through Fall 2027 -- revisit then)
          - { os: ubuntu-latest,   arch: x64,   ext: '',     ship: false }   # build canary, never shipped (no Claude Desktop on Linux)
    env:
      # Frozen binary self-re-execs into these .py; pinned sibling, mirrors the Floor job.
      CANDIDATE_SUITE_DIR: ${{ github.workspace }}/candidate-suite
    steps:
      - uses: actions/checkout@v5

      - name: Checkout candidate-suite (pinned)
        uses: actions/checkout@v5
        with:
          repository: David-BS/candidate-suite
          ref: 2863162ee8bdb6260dd6d0c99621115a5b89cb6a   # full immutable SHA (v1.0.0 tip); checkout cannot fetch a short SHA
          path: candidate-suite

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # freeze with the version that tests; the frozen-proof is the 3.12->3.13 oracle for candidate-suite

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt          # runtime deps PyInstaller bundles from server.py's import graph
          pip install -r requirements-build.txt    # pinned build toolchain (single-sourced, mirrors the proven win-x64 build)

      - name: Build frozen binary
        run: pyinstaller --noconfirm --clean packaging/agent-candidate.spec

      - name: Prove frozen build (self-re-exec)
        run: python lab/test_frozen_build.py

      - name: Prove frozen server (JSON-RPC boot)
        run: python lab/test_frozen_server.py dist/agent-candidate/agent-candidate${{ matrix.ext }}

      - name: Upload bundle
        if: matrix.ship
        uses: actions/upload-artifact@v4
        with:
          name: agent-candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/agent-candidate
