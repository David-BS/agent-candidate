name: release

# Packaging family, two slices in one workflow:
#   build    -- freeze the binary on every target, gate each with the frozen-proofs
#               (slice 1). contents: read. No assembly, no upload to a Release.
#   assemble -- stage one .mcpb per ship target (binary + pinned candidate-suite +
#               manifest), validate + pack with the mcpb CLI, and -- on a tag only --
#               attach them to the GitHub Release (slice 2). This is the ONLY job that
#               earns contents: write, and only the attach step uses it.
# workflow_dispatch lets the whole matrix + a dry-run assembly be observed without a tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash            # uniform shell across legs; avoids pwsh/bash path divergence on Windows

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false     # a red leg must not cancel the others -- we want every target's verdict
      matrix:
        include:
          - { os: windows-latest,  arch: x64,   ext: '.exe', ship: true  }
          - { os: macos-14,        arch: arm64, ext: '',     ship: true  }   # Apple Silicon
          - { os: macos-15-intel,  arch: x64,   ext: '',     ship: true  }   # Intel x86_64 (macos-13 retired Dec 2025; this label supported through Fall 2027 -- revisit then)
          - { os: ubuntu-latest,   arch: x64,   ext: '',     ship: false }   # build canary, never shipped (no Claude Desktop on Linux)
    env:
      # Frozen binary self-re-execs into these .py; pinned sibling, mirrors the Floor job.
      CANDIDATE_SUITE_DIR: ${{ github.workspace }}/candidate-suite
    steps:
      - uses: actions/checkout@v5

      - name: Checkout candidate-suite (pinned)
        uses: actions/checkout@v5
        with:
          repository: David-BS/candidate-suite
          ref: 2863162ee8bdb6260dd6d0c99621115a5b89cb6a   # full immutable SHA (v1.0.0 tip); checkout cannot fetch a short SHA
          path: candidate-suite

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # freeze with the version that tests; the frozen-proof is the 3.12->3.13 oracle for candidate-suite

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt          # runtime deps PyInstaller bundles from server.py's import graph
          pip install -r requirements-build.txt    # pinned build toolchain (single-sourced, mirrors the proven win-x64 build)

      - name: Build frozen binary
        run: pyinstaller --noconfirm --clean packaging/agent-candidate.spec

      - name: Prove frozen build (self-re-exec)
        run: python lab/test_frozen_build.py

      - name: Prove frozen server (JSON-RPC boot)
        run: python lab/test_frozen_server.py dist/agent-candidate/agent-candidate${{ matrix.ext }}

      - name: Upload bundle
        if: matrix.ship
        uses: actions/upload-artifact@v4
        with:
          name: agent-candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/agent-candidate

  assemble:
    name: assemble + attach (.mcpb)
    needs: build
    runs-on: ubuntu-latest          # pack is OS-agnostic (zip + manifest schema); cheapest runner
    timeout-minutes: 15
    permissions:
      contents: write               # the one job that earns write -- used only by the attach step (tag only)
    steps:
      - uses: actions/checkout@v5    # for manifest.json + .mcpbignore

      - name: Checkout candidate-suite (pinned)
        uses: actions/checkout@v5
        with:
          repository: David-BS/candidate-suite
          ref: 2863162ee8bdb6260dd6d0c99621115a5b89cb6a   # the .py travel beside the binary at ${__dirname}/candidate-suite; full proven tree (== build's CANDIDATE_SUITE_DIR)
          path: _suite

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mcpb CLI (pinned)
        run: npm install -g @anthropic-ai/mcpb@2.1.2

      - name: Download ship binaries
        uses: actions/download-artifact@v8
        with:
          path: _artifacts          # -> _artifacts/<artifact-name>/{agent-candidate[.exe],_internal/} (current run only)

      - name: Stage, validate and pack one .mcpb per ship target
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' manifest.json)
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "::error::manifest.json has no version"; exit 1; }
          echo "Manifest version: $VERSION"

          rm -rf _suite/.git                 # never ship a .git into the bundle (pack also auto-excludes, belt + braces)

          # ship target (.mcpb suffix) -> downloaded build-artifact name
          declare -A TARGETS=(
            [win-x64]=agent-candidate-windows-latest-x64
            [mac-arm64]=agent-candidate-macos-14-arm64
            [mac-x64]=agent-candidate-macos-15-intel-x64
          )

          mkdir -p _dist
          for suffix in "${!TARGETS[@]}"; do
            art="${TARGETS[$suffix]}"
            src="_artifacts/$art"
            [ -d "$src" ] || { echo "::error::missing build artifact $src (build leg did not upload?)"; exit 1; }

            bundle="_bundle-$suffix"
            rm -rf "$bundle"
            mkdir -p "$bundle/server"
            # per-target compatibility: declare only the platform this bundle actually carries
            # (the repo manifest lists the union; a bundle must not claim a platform it has no binary for)
            case "$suffix" in
              win-x64)            platforms='["win32"]'  ;;
              mac-arm64|mac-x64)  platforms='["darwin"]' ;;
              *) echo "::error::unknown ship target $suffix (update platforms case)"; exit 1 ;;
            esac
            jq --argjson p "$platforms" '.compatibility.platforms = $p' manifest.json > "$bundle/manifest.json"
            cp .mcpbignore   "$bundle/.mcpbignore"
            cp -R "$src/."  "$bundle/server/"        # agent-candidate[.exe] + _internal/ -> server/ (manifest entry_point)
            cp -R _suite    "$bundle/candidate-suite"  # full proven tree; .mcpbignore prunes non-runtime infra

            # upload/download-artifact drop POSIX modes -> staged launcher is 0644 -> permission denied / exit 126 at
            # spawn (upstream of Gatekeeper). Restore +x on the no-extension launcher (mac/linux); the .exe (win) does
            # not use the bit. mcpb pack preserves the mode into the .mcpb.
            [ -e "$bundle/server/agent-candidate" ] && chmod +x "$bundle/server/agent-candidate"

            # host appends .exe on win32 for binary type; assert a launcher sits where the manifest points
            if [ ! -e "$bundle/server/agent-candidate" ] && [ ! -e "$bundle/server/agent-candidate.exe" ]; then
              echo "::error::no launcher at $bundle/server/agent-candidate[.exe]"; exit 1
            fi

            mcpb validate "$bundle"                   # schema gate (manifest_version 0.3) -- let the validator speak
            out="_dist/agent-candidate-$VERSION-$suffix.mcpb"
            mcpb pack "$bundle" "$out"
            echo "Packed $out"
          done
          echo "--- bundles ---"; ls -la _dist

      - name: Upload .mcpb (inspectable on dispatch and tag)
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundles
          path: _dist/*.mcpb

      - name: Guard tag == manifest version (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' manifest.json)
          TAG="${GITHUB_REF_NAME}"
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG != manifest v$VERSION (refusing to attach a version-mismatched bundle)"; exit 1; }
          echo "Tag $TAG matches manifest v$VERSION"

      - name: Attach .mcpb to the Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" \
                 --notes "Automated MCP Bundle release for $TAG. One .mcpb per supported target (win-x64, mac-arm64, mac-x64). Unsigned (signature deferred)."
          gh release upload "$TAG" _dist/*.mcpb --clobber
          echo "Attached $(ls _dist/*.mcpb | wc -l) bundle(s) to release $TAG"
